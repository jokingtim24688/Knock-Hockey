<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Locked viewport: the game is structurally sized like a phone screen even on desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Knock Hockey</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    THE "PHONE" CONTAINER
    Exactly 390 x 844 px (iPhone-ish logical resolution). Everything the game
    renders lives inside this box so an external OpenCV script can treat it as
    the entire device screen.
  -->
  <div id="phone" class="phone">

    <!--
      COMPUTER VISION ANCHORS  (DO NOT ALTER)
      10x10 pure magenta (#FF00FF) squares pinned to the four absolute corners.
      A Python/OpenCV script thresholds for this exact color to recover the
      bounding box (and therefore the pixel-to-game coordinate mapping).
    -->
    <div class="cv-anchor cv-tl"></div>
    <div class="cv-anchor cv-tr"></div>
    <div class="cv-anchor cv-bl"></div>
    <div class="cv-anchor cv-br"></div>

    <!-- FAKE MULTIPLAYER HEADER: two profile circles + scoreboard -->
    <header class="hud">
      <div class="player player-left">
        <div class="avatar avatar-1" aria-hidden="true">A</div>
        <span class="player-name">Alex</span>
      </div>

      <div class="scoreboard">
        <span id="score-left" class="score score-left">0</span>
        <span class="score-sep">:</span>
        <span id="score-right" class="score score-right">0</span>
      </div>

      <div class="player player-right">
        <div class="avatar avatar-2" aria-hidden="true">J</div>
        <span class="player-name">Jordan</span>
      </div>
    </header>

    <!-- PLAYFIELD: Matter.js renders into this canvas -->
    <div id="arena" class="arena">
      <canvas id="game-canvas"></canvas>
    </div>

    <!--
      OVERLAY MENU  (frosted-glass mod-menu aesthetic)
      An HTML overlay layered on top of the canvas. Holds the primary Mode
      Toggle (iOS-style segmented control) and, in Normal Mode, the AI Aim
      Assist sub-toggle. Collapsible so it does not permanently cover the field.
    -->
    <div id="overlay" class="overlay">
      <button id="overlay-handle" class="overlay-handle" type="button" aria-expanded="true">
        <span class="handle-dot"></span>
        <span class="handle-title">CONTROLS</span>
        <span class="handle-chevron" aria-hidden="true">▾</span>
      </button>

      <div id="overlay-body" class="overlay-body">
        <div class="control-block">
          <span class="control-label">Mode</span>
          <!-- iOS segmented control: sliding thumb behind the active segment -->
          <div class="segmented" id="mode-seg" role="tablist" aria-label="Engine mode">
            <span class="seg-thumb" id="seg-thumb" aria-hidden="true"></span>
            <button id="mode-normal" class="seg-btn active" data-mode="normal" role="tab" aria-selected="true" type="button">
              Normal
            </button>
            <button id="mode-training" class="seg-btn" data-mode="training" role="tab" aria-selected="false" type="button">
              Training
            </button>
          </div>
        </div>

        <!-- Sub-toggle: only meaningful in Normal Mode -->
        <div class="control-row" id="assist-row">
          <span class="control-label" id="assist-label">AI Aim Assist</span>
          <label class="switch" aria-labelledby="assist-label">
            <input type="checkbox" id="assist-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <button id="reset-btn" class="ghost-btn" type="button">Reset Puck</button>

        <p id="mode-hint" class="mode-hint">
          Drag from the puck and release to flick it.
        </p>
      </div>
    </div>
  </div>

  <!-- Matter.js physics engine (vendored locally so the prototype runs offline) -->
  <script src="matter.min.js"></script>
  <!-- Game logic -->
  <script src="game.js"></script>
</body>
</html>
